name: Fast CI Checks

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - main

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
                  cache: "pip"
            - run: pip install -r requirements.txt
            - run: ruff check .
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
                  cache: "pip"
            - run: |
                  pip install -r requirements.txt
                  pip install pyright
            - run: pyright
